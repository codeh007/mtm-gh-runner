name: publish

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN repository Actions secret is required" >&2; exit 1; }
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$version" = "$(node -p 'require("./package.json").version')"
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      - run: cargo install cargo-about --locked --features cli
      - run: npm run build
      - name: Pack and publish npm CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          tarball="$RUNNER_TEMP/$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")"
          tar -tzf "$tarball" | grep -Fxq 'package/dist/mtm-gh-runner'
          npm publish "$tarball" --access public --provenance --registry=https://registry.npmjs.org
      - name: Publish amd64 GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${IMAGE_TAG#v}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --build-arg VERSION="$version" --tag "ghcr.io/codeh007/mtm-gh-runner:$version" --push .
